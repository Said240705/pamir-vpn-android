name: Mognu Desktop (Windows)

# Сборка Mognu VPN для Windows: ядро Xray той же версии, что в Android (go.mod в AndroidLibXrayLite), окно на Tauri,
# установщик NSIS. Тесты разбора подписки — с настоящим xray. С release: true — публикует релиз desktop-v<версия>
# как пре-релиз: Android и сайт берут обновления из releases/latest, а пре-релиз «последним» не становится никогда.
on:
  push:
    branches: [mognu]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать установщик как релиз desktop-v<версия из tauri.conf.json>'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # скачать установщик 0.2.0 из файлов её сборки (проверка переезда)

env:
  # тот же коммит xray-core, что в AndroidLibXrayLite/go.mod (v1.260327.1-0.20260908222543-52a412d9e2f5)
  XRAY_REF: 52a412d9e2f5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build xray (Linux, for config tests)
        run: GOBIN=$RUNNER_TEMP go install -trimpath github.com/xtls/xray-core/main@$XRAY_REF
      - name: Subscription parser and config tests
        working-directory: desktop
        run: XRAY_BIN=$RUNNER_TEMP/main node --test "test/*.test.mjs"

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build xray.exe
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/xray" go install -trimpath -ldflags="-s -w -buildid=" github.com/xtls/xray-core/main@$XRAY_REF
          mkdir -p desktop/src-tauri/binaries
          cp "$RUNNER_TEMP/xray/main.exe" desktop/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe
          desktop/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe version | head -1

      - name: Wintun driver (for «весь трафик»)
        shell: bash
        run: |
          # официальная сборка WireGuard; сумма архива сверяется, чтобы в установщик не попало чужое
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll desktop/src-tauri/binaries/wintun.dll

      - name: Build installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Smoke test on Windows
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          # снимки окна установщика (первая страница и следующая) — для проверки оформления
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          $ui = Start-Process $setup.FullName -PassThru; Start-Sleep 6; Shot shots/0-installer.png
          $sh = New-Object -ComObject WScript.Shell
          if ($sh.AppActivate($ui.Id)) { Start-Sleep 1; $sh.SendKeys('{ENTER}'); Start-Sleep 6; Shot shots/0-installer-2.png }
          Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          # переезд со старого имени: сначала ставим 0.2.0 («Mognu» в %LOCALAPPDATA%\Mognu), поверх — новую версию
          # тихо, как это делает автообновление; старая папка и запись в «Программах» должны исчезнуть
          # ждём только сам установщик: Start-Process -Wait ждёт ещё и всё, что он запустил, а после переезда
          # установщик открывает программу (она живёт в трее и сама не закрывается)
          function Install($exe) {
            $p = Start-Process $exe -ArgumentList '/S' -PassThru
            if (!$p.WaitForExit(300000)) { throw "установщик $exe не закончил за 5 минут" }
          }
          # установщик 0.2.0 — из файлов её сборки (релиз desktop-v0.2.0 удалила очистка релизов Android 1.7.8);
          # файлы сборки GitHub хранит 90 дней, после этого переезд с 0.2.0 проверить уже не из чего
          gh run download 39549483619 -n mognu-windows -D old
          $old = Get-ChildItem old -Filter *.exe -Recurse | Select-Object -First 1
          if (!$old) { throw 'установщик 0.2.0 недоступен — переезд с 0.2.0 проверить не из чего' }
          Write-Host "ставлю 0.2.0: $($old.Name)"
          Install $old.FullName
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA 'Mognu\mognu.exe'))) { throw 'старая версия 0.2.0 не установилась' }
          Write-Host 'ставлю новую версию поверх'
          Install $setup.FullName
          Start-Sleep 3
          $opened = @(Get-Process mognu -ErrorAction SilentlyContinue).Count
          Write-Host "после тихого обновления программа открылась сама: $($opened -gt 0)"
          Get-Process mognu -ErrorAction SilentlyContinue | Stop-Process -Force
          $oldLeft = Test-Path (Join-Path $env:LOCALAPPDATA 'Mognu')
          $oldKey = Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Mognu'
          $newKey = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Mognu VPN' -ErrorAction SilentlyContinue).DisplayName
          Write-Host "после обновления: старая папка=$oldLeft, старая запись=$oldKey, новая запись=$newKey"
          if ($oldLeft -or $oldKey -or $newKey -ne 'Mognu VPN' -or $opened -eq 0) { throw 'переезд с «Mognu» на «Mognu VPN» не удался' }
          'Обновление с 0.2.0 («Mognu») на «Mognu VPN»: старая копия убрана, новая на месте ✅' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $dir = Join-Path $env:LOCALAPPDATA 'Mognu VPN'
          Get-ChildItem $dir | Format-Table Name, Length
          if (!(Test-Path (Join-Path $dir 'xray.exe'))) { throw 'xray.exe не установлен' }
          if (!(Test-Path (Join-Path $dir 'mognu.exe'))) { throw 'mognu.exe не установлен' }
          if (!(Test-Path (Join-Path $dir 'wintun.dll'))) { throw 'wintun.dll не установлен рядом с ядром' }
          # конфиг, собранный интерфейсом, принимает установленное ядро
          node -e "import('./ui/xray.js').then(m=>{const p=m.parseLink('vless://11111111-2222-4333-8444-555555555555@203.0.113.10:443?type=xhttp&security=tls&mode=packet-up&path=%2Fapi%2Fstream%2F#t');require('fs').writeFileSync('smoke.json',JSON.stringify(m.buildConfig(p,{socks:10808,http:10809})))})"
          & (Join-Path $dir 'xray.exe') run -test -c smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'xray не принял конфиг' }
          # программа запускается и не падает сразу
          $app = Start-Process (Join-Path $dir 'mognu.exe') -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "mognu.exe завершился с кодом $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host 'OK'

      - name: Connect through every server (test subscription)
        shell: pwsh
        working-directory: desktop
        env:
          MOGNU_TEST_SUB: ${{ secrets.MOGNU_TEST_SUB }}
        run: |
          node test/e2e.mjs (Join-Path $env:LOCALAPPDATA 'Mognu VPN\xray.exe') | Tee-Object -FilePath e2e.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content e2e.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Real app on Windows - screenshots and system proxy
        shell: pwsh
        working-directory: desktop
        env:
          MOGNU_TEST_SUB: ${{ secrets.MOGNU_TEST_SUB }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:MOGNU_TEST_SUB) { Write-Host 'MOGNU_TEST_SUB не задан — пропускаю'; exit 0 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
            Write-Host "снимок $path ($($b.Width)x$($b.Height))"
          }
          function Proxy() { Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' | Select-Object ProxyEnable, ProxyServer }
          $exe = Join-Path $env:LOCALAPPDATA 'Mognu VPN\mognu.exe'
          New-Item -ItemType Directory -Force shots | Out-Null

          # 1. главный экран с серверами из тестовой подписки
          $env:MOGNU_DEMO_SUB = $env:MOGNU_TEST_SUB
          $app = Start-Process $exe -PassThru; Start-Sleep 14; Shot shots/1-home.png; Stop-Process -Id $app.Id -Force; Start-Sleep 2

          # 2. сразу подключиться: программа сама включает системный прокси Windows
          $env:MOGNU_DEMO_CONNECT = '1'
          $app = Start-Process $exe -PassThru; Start-Sleep 30; Shot shots/2-connected.png
          $p = Proxy; Write-Host "прокси при подключении: включён=$($p.ProxyEnable) адрес=$($p.ProxyServer)"
          $ok = $p.ProxyEnable -eq 1 -and $p.ProxyServer -like '127.0.0.1:*'
          if ($ok) {
            $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 15 -x "http://$($p.ProxyServer)" https://www.google.com/generate_204
            Write-Host "сайт через системный прокси: $code"
            $ok = $code -eq '204'
          }
          # ядро упало (снимаем xray.exe): Mognu сам перезапускает его на тех же портах, прокси всё это время на месте
          Get-Process xray -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 30
          $code2 = curl.exe -s -o NUL -w '%{http_code}' --max-time 15 -x "http://$($p.ProxyServer)" https://www.google.com/generate_204
          $healed = $code2 -eq '204' -and @(Get-Process xray -ErrorAction SilentlyContinue).Count -eq 1
          Write-Host "после падения ядра: переподключился=$healed (сайт $code2)"
          # крестик окна: программа не выходит и не отключается — прячется в трей
          $null = $app.CloseMainWindow(); Start-Sleep 3
          $p2 = Proxy
          $tray = -not $app.HasExited -and $p2.ProxyEnable -eq 1
          Write-Host "после крестика: программа работает=$(-not $app.HasExited), прокси включён=$($p2.ProxyEnable)"
          # Windows 11 прячет новые значки под «^»; для снимка выносим значок Mognu на панель — то же, что перетащить его руками
          Get-ChildItem 'HKCU:\Control Panel\NotifyIconSettings' -ErrorAction SilentlyContinue | ForEach-Object {
            if ((Get-ItemProperty $_.PSPath).ExecutablePath -like '*mognu.exe') { Set-ItemProperty $_.PSPath -Name IsPromoted -Value 1 -Type DWord; Write-Host 'значок Mognu вынесен на панель' }
          }
          Start-Sleep 3
          Shot shots/4-tray.png
          # аварийное закрытие: прокси остаётся, но следующий запуск обязан его убрать; ядро должно умереть вместе с программой
          Stop-Process -Id $app.Id -Force; Start-Sleep 2
          $orphan = @(Get-Process xray -ErrorAction SilentlyContinue).Count
          Write-Host "ядер xray после аварийного закрытия: $orphan"

          # запуск вместе с Windows (--autostart): окна не видно, программа в трее и подключается сама
          $app = Start-Process $exe -ArgumentList '--autostart' -PassThru; Start-Sleep 30
          $app.Refresh()
          # какие окна программы видны (класс и заголовок) — чтобы понять, что именно показалось
          Add-Type -Namespace W -Name U -MemberDefinition @'
          public delegate bool EnumProc(System.IntPtr h, System.IntPtr p);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, System.IntPtr p);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr h);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(System.IntPtr h, out uint pid);
          [System.Runtime.InteropServices.DllImport("user32.dll", CharSet=System.Runtime.InteropServices.CharSet.Unicode)] public static extern int GetClassName(System.IntPtr h, System.Text.StringBuilder s, int n);
          [System.Runtime.InteropServices.DllImport("user32.dll", CharSet=System.Runtime.InteropServices.CharSet.Unicode)] public static extern int GetWindowText(System.IntPtr h, System.Text.StringBuilder s, int n);
          '@
          $vis = [System.Collections.Generic.List[string]]::new()
          [W.U]::EnumWindows({ param($h, $x) $wp = 0; [void][W.U]::GetWindowThreadProcessId($h, [ref]$wp)
            if ($wp -eq $app.Id -and [W.U]::IsWindowVisible($h)) { $c = [Text.StringBuilder]::new(256); $t = [Text.StringBuilder]::new(256)
              [void][W.U]::GetClassName($h, $c, 256); [void][W.U]::GetWindowText($h, $t, 256); $vis.Add("$c «$t»") }
            return $true }, [IntPtr]::Zero) | Out-Null
          Write-Host "видимые окна при автозапуске: $($vis.Count) $($vis -join '; ')"
          Shot shots/6-autostart.png
          $hidden = $vis.Count -eq 0
          $pa = Proxy
          $auto = $hidden -and $pa.ProxyEnable -eq 1 -and $pa.ProxyServer -like '127.0.0.1:*'
          Write-Host "автозапуск: окно скрыто=$hidden, подключился=$($pa.ProxyEnable -eq 1)"
          Stop-Process -Id $app.Id -Force; Start-Sleep 2

          # 3. обычный запуск без аккаунта — экран входа; прокси от прошлого раза должен выключиться сам
          Remove-Item Env:MOGNU_DEMO_SUB, Env:MOGNU_DEMO_CONNECT
          $app = Start-Process $exe -PassThru; Start-Sleep 10; Shot shots/3-login.png
          $p = Proxy; Write-Host "прокси после аварийного закрытия и нового запуска: включён=$($p.ProxyEnable)"
          $cleared = $p.ProxyEnable -ne 1
          Stop-Process -Id $app.Id -Force

          # 4. режим «весь трафик»: без всякого прокси IP меняется; после выхода интернет работает напрямую
          $direct = curl.exe -s --max-time 15 https://api.ipify.org
          $env:MOGNU_DEMO_SUB = $env:MOGNU_TEST_SUB; $env:MOGNU_DEMO_CONNECT = '1'; $env:MOGNU_DEMO_TUN = '1'
          $app = Start-Process $exe -PassThru; Start-Sleep 35
          $adapter = @(Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'Mognu' }).Count
          $p3 = Proxy
          $tunIp = curl.exe -s --max-time 20 https://api.ipify.org
          $tunWeb = curl.exe -s -o NUL -w '%{http_code}' --max-time 20 https://www.google.com/generate_204
          Shot shots/5-tun.png
          Write-Host "весь трафик: адаптер Mognu=$adapter, системный прокси=$($p3.ProxyEnable), IP сменился=$($tunIp -and $tunIp -ne $direct), сайт=$tunWeb"
          $tunOk = $adapter -eq 1 -and $tunIp -and $tunIp -ne $direct -and $tunWeb -eq '204'
          if (-not $tunOk) {
            # журнал ядра и ошибка программы (core.log) — адреса и имена хостов скрыты, лог публичный
            $log = Get-Content (Join-Path $env:APPDATA 'app.mognu.desktop\core.log') -Raw -ErrorAction SilentlyContinue
            $log = $log -replace '\b\d{1,3}(\.\d{1,3}){3}\b', 'x.x.x.x' -replace '[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}', 'host'
            Write-Host "--- core.log (последние строки) ---"; ($log -split "`n" | Select-Object -Last 40) -join "`n" | Write-Host
          }
          Stop-Process -Id $app.Id -Force; Start-Sleep 4
          Remove-Item Env:MOGNU_DEMO_SUB, Env:MOGNU_DEMO_CONNECT, Env:MOGNU_DEMO_TUN
          $after = curl.exe -s --max-time 15 https://api.ipify.org
          $left = @(Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'Mognu' }).Count
          Write-Host "после закрытия: адаптер Mognu остался=$left, интернет напрямую=$($after -eq $direct)"
          $tunClean = $after -eq $direct -and $left -eq 0

          # снимки — в пре-релиз desktop-screens (только интерфейс: имена серверов, без адресов и ключей)
          gh release view desktop-screens 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create desktop-screens --prerelease --latest=false --title 'Mognu VPN для Windows — скриншоты из проверки' --notes 'Снимки экрана настоящей программы на Windows, обновляются при каждой сборке.' }
          gh release upload desktop-screens (Get-ChildItem shots/*.png).FullName --clobber
          if (!$ok) { throw 'подключение через системный прокси не сработало' }
          if (!$cleared) { throw 'прокси не выключился после аварийного закрытия' }
          if ($orphan -gt 0) { throw 'xray.exe остался работать после закрытия программы' }
          if (!$tunOk) { throw 'режим «весь трафик» не пустил трафик через Mognu' }
          if (!$tunClean) { throw 'после закрытия в режиме «весь трафик» интернет не вернулся как был' }
          if (!$tray) { throw 'крестик окна закрыл программу или отключил — должна была спрятаться в трей' }
          if (!$healed) { throw 'после падения ядра Mognu VPN не переподключился сам' }
          if (!$auto) { throw 'запуск с --autostart показал окно или не подключился' }
          'Программа на Windows: подключение через системный прокси ✅, крестик прячет в трей ✅, весь трафик через адаптер Mognu ✅, после закрытия интернет как был ✅, прокси убирается после аварийного закрытия ✅, переподключение после падения ядра ✅, автозапуск в трей ✅' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: mognu-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          F=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$F" "Mognu-Setup-$V.exe"
          gh release create "desktop-v$V" "Mognu-Setup-$V.exe" --title "Mognu VPN для Windows $V" \
            --notes "Mognu VPN для Windows. Скачай Mognu-Setup-$V.exe и запусти — установка без прав администратора." --prerelease --latest=false

name: Mognu Desktop (Windows)

# Сборка Mognu для Windows: ядро Xray той же версии, что в Android (go.mod в AndroidLibXrayLite), окно на Tauri,
# установщик NSIS. Тесты разбора подписки — с настоящим xray. С release: true — публикует релиз desktop-v<версия>
# как пре-релиз: Android и сайт берут обновления из releases/latest, а пре-релиз «последним» не становится никогда.
on:
  push:
    branches: [mognu]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать установщик как релиз desktop-v<версия из tauri.conf.json>'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # тот же коммит xray-core, что в AndroidLibXrayLite/go.mod (v1.260327.1-0.20260908222543-52a412d9e2f5)
  XRAY_REF: 52a412d9e2f5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build xray (Linux, for config tests)
        run: GOBIN=$RUNNER_TEMP go install -trimpath github.com/xtls/xray-core/main@$XRAY_REF
      - name: Subscription parser and config tests
        working-directory: desktop
        run: XRAY_BIN=$RUNNER_TEMP/main node --test "test/*.test.mjs"

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build xray.exe
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/xray" go install -trimpath -ldflags="-s -w -buildid=" github.com/xtls/xray-core/main@$XRAY_REF
          mkdir -p desktop/src-tauri/binaries
          cp "$RUNNER_TEMP/xray/main.exe" desktop/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe
          desktop/src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe version | head -1

      - name: Build installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Smoke test on Windows
        shell: pwsh
        working-directory: desktop
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length/1MB,1)) MB"
          # тихая установка для текущего пользователя и проверка, что ядро лежит рядом с программой
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Mognu'
          Get-ChildItem $dir | Format-Table Name, Length
          if (!(Test-Path (Join-Path $dir 'xray.exe'))) { throw 'xray.exe не установлен' }
          if (!(Test-Path (Join-Path $dir 'mognu.exe'))) { throw 'mognu.exe не установлен' }
          # конфиг, собранный интерфейсом, принимает установленное ядро
          node -e "import('./ui/xray.js').then(m=>{const p=m.parseLink('vless://11111111-2222-4333-8444-555555555555@203.0.113.10:443?type=xhttp&security=tls&mode=packet-up&path=%2Fapi%2Fstream%2F#t');require('fs').writeFileSync('smoke.json',JSON.stringify(m.buildConfig(p,{socks:10808,http:10809})))})"
          & (Join-Path $dir 'xray.exe') run -test -c smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'xray не принял конфиг' }
          # программа запускается и не падает сразу
          $app = Start-Process (Join-Path $dir 'mognu.exe') -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "mognu.exe завершился с кодом $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host 'OK'

      - name: Connect through every server (test subscription)
        shell: pwsh
        working-directory: desktop
        env:
          MOGNU_TEST_SUB: ${{ secrets.MOGNU_TEST_SUB }}
        run: |
          node test/e2e.mjs (Join-Path $env:LOCALAPPDATA 'Mognu\xray.exe') | Tee-Object -FilePath e2e.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content e2e.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Real app on Windows - screenshots and system proxy
        shell: pwsh
        working-directory: desktop
        env:
          MOGNU_TEST_SUB: ${{ secrets.MOGNU_TEST_SUB }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:MOGNU_TEST_SUB) { Write-Host 'MOGNU_TEST_SUB не задан — пропускаю'; exit 0 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
            Write-Host "снимок $path ($($b.Width)x$($b.Height))"
          }
          function Proxy() { Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' | Select-Object ProxyEnable, ProxyServer }
          $exe = Join-Path $env:LOCALAPPDATA 'Mognu\mognu.exe'
          New-Item -ItemType Directory -Force shots | Out-Null

          # 1. главный экран с серверами из тестовой подписки
          $env:MOGNU_DEMO_SUB = $env:MOGNU_TEST_SUB
          $app = Start-Process $exe -PassThru; Start-Sleep 14; Shot shots/1-home.png; Stop-Process -Id $app.Id -Force; Start-Sleep 2

          # 2. сразу подключиться: программа сама включает системный прокси Windows
          $env:MOGNU_DEMO_CONNECT = '1'
          $app = Start-Process $exe -PassThru; Start-Sleep 30; Shot shots/2-connected.png
          $p = Proxy; Write-Host "прокси при подключении: включён=$($p.ProxyEnable) адрес=$($p.ProxyServer)"
          $ok = $p.ProxyEnable -eq 1 -and $p.ProxyServer -like '127.0.0.1:*'
          if ($ok) {
            $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 15 -x "http://$($p.ProxyServer)" https://www.google.com/generate_204
            Write-Host "сайт через системный прокси: $code"
            $ok = $code -eq '204'
          }
          # аварийное закрытие: прокси остаётся, но следующий запуск обязан его убрать; ядро должно умереть вместе с программой
          Stop-Process -Id $app.Id -Force; Start-Sleep 2
          $orphan = @(Get-Process xray -ErrorAction SilentlyContinue).Count
          Write-Host "ядер xray после аварийного закрытия: $orphan"

          # 3. обычный запуск без аккаунта — экран входа; прокси от прошлого раза должен выключиться сам
          Remove-Item Env:MOGNU_DEMO_SUB, Env:MOGNU_DEMO_CONNECT
          $app = Start-Process $exe -PassThru; Start-Sleep 10; Shot shots/3-login.png
          $p = Proxy; Write-Host "прокси после аварийного закрытия и нового запуска: включён=$($p.ProxyEnable)"
          $cleared = $p.ProxyEnable -ne 1
          Stop-Process -Id $app.Id -Force

          # снимки — в пре-релиз desktop-screens (только интерфейс: имена серверов, без адресов и ключей)
          gh release view desktop-screens 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create desktop-screens --prerelease --latest=false --title 'Mognu для Windows — скриншоты из проверки' --notes 'Снимки экрана настоящей программы на Windows, обновляются при каждой сборке.' }
          gh release upload desktop-screens shots/1-home.png shots/2-connected.png shots/3-login.png --clobber
          if (!$ok) { throw 'подключение через системный прокси не сработало' }
          if (!$cleared) { throw 'прокси не выключился после аварийного закрытия' }
          if ($orphan -gt 0) { throw 'xray.exe остался работать после закрытия программы' }
          'Программа на Windows: подключение через системный прокси ✅, прокси убирается после аварийного закрытия ✅' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: mognu-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          F=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$F" "Mognu-Setup-$V.exe"
          gh release create "desktop-v$V" "Mognu-Setup-$V.exe" --title "Mognu для Windows $V" \
            --notes "Mognu для Windows. Скачай Mognu-Setup-$V.exe и запусти — установка без прав администратора." --prerelease --latest=false

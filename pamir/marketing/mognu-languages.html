<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;font-weight:700 900;src:url(fonts/unbounded-latin.woff2)}
@font-face{font-family:Unb;font-weight:700 900;src:url(fonts/unbounded-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Onest;font-weight:400 800;src:url(fonts/onest-latin.woff2)}
@font-face{font-family:Onest;font-weight:400 800;src:url(fonts/onest-cyrillic.woff2);unicode-range:U+0400-045F}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
</style></head><body><svg id="s" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const DURATION=6;
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), k=(t,a,b)=>cl((t-a)/(b-a),0,1), eo=x=>1-Math.pow(1-cl(x,0,1),3);
const back=x=>{x=cl(x,0,1);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let sd=3;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const ST=[];for(let i=0;i<50;i++)ST.push([R()*1280,R()*720,R()*2+.6,R()]);
const LETTERS=["A","Я","ғ","ӯ","B","Ж","ҷ","Q","ӣ","W","Ф","ҳ"];const FLY=LETTERS.map((c,i)=>[c,R()*560,R(),R()]);
const T=(x,y,s,txt,o={})=>`<text x="${x}" y="${y}" font-family="${o.f||'Unb'}" font-weight="${o.w||800}" font-size="${s}" fill="${o.c||'#fff'}" text-anchor="${o.a||'start'}" opacity="${o.op??1}">${txt}</text>`;
// пузырь над Могну: Привет → Hello → а по-шугнански?
const BUB=[["Привет!","#C8FF2E"],["Hello!","#7FE3FF"],["А на шугнанском?","#FFC93C"]];
window.render=function(t){
  let o=`<defs><radialGradient id="bg" cx=".3" cy=".45" r=".9"><stop offset="0" stop-color="#3A2A78"/><stop offset=".55" stop-color="#1E1640"/><stop offset="1" stop-color="#120E26"/></radialGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#C8FF2E" stop-opacity=".34"/><stop offset=".6" stop-color="#C8FF2E" stop-opacity=".06"/><stop offset="1" stop-color="#C8FF2E" stop-opacity="0"/></radialGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>`;
  for(const [x,y,r,p] of ST)o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.15+.35*Math.abs(Math.sin(t*1.2+p*7))}"/>`;
  // летящие буквы разных алфавитов
  for(const [c,x,sp,ph] of FLY){const y=720-((t/DURATION+ph)%1)*820;o+=T(40+x,y,30+24*sp,c,{c:'#B79CFF',op:.18+.18*sp});}
  // Могну
  const bob=8*Math.sin(t*Math.PI*2/1.5), tilt=3*Math.sin(t*Math.PI*2/3);
  o+=`<circle cx="330" cy="430" r="250" fill="url(#gl)"/>`;
  o+=`<g transform="translate(330 ${440+bob}) rotate(${tilt}) scale(1.35) translate(-120 -145)"><image href="on.svg" width="240" height="290"/></g>`;
  // пузырь
  const ph=Math.floor(t/2)%3, lt=t%2, sc=back(k(lt,0,.35))*(1-k(lt,1.75,2));
  const [txt,col]=BUB[ph], w=txt.length*25+70;
  o+=`<g transform="translate(360 ${150+bob*.6}) scale(${sc})"><rect x="${-w/2}" y="-46" width="${w}" height="84" rx="28" fill="#fff"/><rect x="${-w/2+6}" y="-40" width="${w-12}" height="72" rx="24" fill="${col}"/>`+
    `<path d="M-18 36 L-36 70 L12 36 Z" fill="${col}" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`+T(0,10,36,txt,{a:'middle',c:'#14102A'})+`</g>`;
  // текст справа
  const a=eo(k(t,0,.6));
  o+=`<g opacity="${a}" transform="translate(${30*(1-a)} 0)">`+T(640,190,26,'MOGNU VPN',{c:'#C8FF2E'})+
     T(640,262,58,'Могну учит')+T(640,332,58,'новые языки')+
     T(640,392,26,'Ищем носителей языка для перевода',{f:'Onest',w:600,c:'#B9B2D9'})+`</g>`;
  const chip=(x,y,txt,c,d)=>{const e=back(k(t,d,d+.5));const w=txt.length*17+60;return `<g transform="translate(${x} ${y}) scale(${e})"><rect x="0" y="-34" width="${w}" height="60" rx="30" fill="${c}"/>${T(w/2,6,25,txt,{a:'middle',c:'#14102A'})}</g>`;};
  o+=chip(640,470,'English','#7FE3FF',.5)+chip(838,470,'Шугнанский','#FFC93C',.7);
  o+=`<g opacity="${eo(k(t,.9,1.4))}">`+T(640,585,26,'💬 Пишите в поддержку',{f:'Onest',w:700})+T(640,628,22,'mognu.app · @pamirlink_bot',{f:'Unb',w:800,c:'#B9B2D9'})+`</g>`;
  document.getElementById('s').innerHTML=o;
};
</script></body></html>

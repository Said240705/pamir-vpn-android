<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;font-weight:700 900;src:url(fonts/unbounded-latin.woff2)}
@font-face{font-family:Unb;font-weight:700 900;src:url(fonts/unbounded-cyrillic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:Onest;font-weight:400 800;src:url(fonts/onest-latin.woff2)}
@font-face{font-family:Onest;font-weight:400 800;src:url(fonts/onest-cyrillic.woff2);unicode-range:U+0400-045F}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
</style></head><body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Ролик для сторис «Могни в сторис»: 11 с, 1080×1920. Верхние ~380 px пустые — туда человек ставит ссылку-стикер.
const DURATION=11;
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), k=(t,a,b)=>cl((t-a)/(b-a),0,1), eo=x=>1-Math.pow(1-cl(x,0,1),3), ei=x=>Math.pow(cl(x,0,1),3);
const back=x=>{x=cl(x,0,1);const c=1.8;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const bump=(t,a,b)=>Math.sin(Math.PI*k(t,a,b));
let sd=5;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const ST=[];for(let i=0;i<70;i++)ST.push([R()*1080,R()*1920,R()*2.4+.6,R()]);
const CONF=[];for(let i=0;i<46;i++)CONF.push([R()*2-1,R(),R(),["#C8FF2E","#FFC93C","#B79CFF","#7FE3FF","#FF6B9A"][i%5]]);
const T=(x,y,s,txt,o={})=>`<text x="${x}" y="${y}" font-family="${o.f||'Unb'}" font-weight="${o.w||800}" font-size="${s}" fill="${o.c||'#fff'}" text-anchor="${o.a||'middle'}" opacity="${o.op??1}"${o.extra||''}>${txt}</text>`;
const crownP="-65,40 -72,-35 -29,1 0,-57 29,1 72,-35 65,40";
window.render=function(t){
  let o=`<defs><radialGradient id="bg" cx=".5" cy=".52" r=".8"><stop offset="0" stop-color="#3A2A78"/><stop offset=".55" stop-color="#1E1640"/><stop offset="1" stop-color="#0F0B22"/></radialGradient>
  <radialGradient id="gl"><stop offset="0" stop-color="#C8FF2E" stop-opacity=".42"/><stop offset=".6" stop-color="#C8FF2E" stop-opacity=".07"/><stop offset="1" stop-color="#C8FF2E" stop-opacity="0"/></radialGradient></defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>`;
  for(const [x,y,r,p] of ST)o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.12+.35*Math.abs(Math.sin(t*1.3+p*7))}"/>`;
  const wake=k(t,1.8,2.3), cx=540;
  // ---- сцена 1–3: Могну и телефон (0–7.6 с)
  if(t<7.9){
    const fade=1-k(t,7.3,7.9);
    o+=`<g opacity="${fade}">`;
    o+=`<circle cx="${cx}" cy="1120" r="${380+30*Math.sin(t*2)}" fill="url(#gl)" opacity="${.25+.75*wake}"/>`;
    // телефон справа, загрузка
    const ph=back(k(t,.2,.8)), ok=k(t,4.1,4.4);
    o+=`<g transform="translate(790 1390) rotate(${8-8*ok}) scale(${ph})">`+
      `<rect x="-130" y="-230" width="260" height="460" rx="44" fill="#fff"/><rect x="-118" y="-218" width="236" height="436" rx="34" fill="#14102A"/>`+
      `<rect x="-104" y="-196" width="208" height="392" rx="24" fill="${ok>0?'#C8FF2E':'#2A1F5A'}" opacity="${ok>0?.15+.85*ok:1}"/>`;
    if(ok<1){ const a=t*360*1.4; o+=`<g opacity="${1-ok}"><circle cx="0" cy="-30" r="44" fill="none" stroke="#3E3380" stroke-width="12"/><circle cx="0" cy="-30" r="44" fill="none" stroke="#B79CFF" stroke-width="12" stroke-dasharray="70 300" stroke-linecap="round" transform="rotate(${a} 0 -30)"/>`+
      T(0,70,30,'Загрузка…',{f:'Onest',w:700,c:'#B9B2D9'})+`<rect x="-80" y="104" width="160" height="14" rx="7" fill="#3E3380"/><rect x="-80" y="104" width="${160*(.12+.06*Math.sin(t*3))}" height="14" rx="7" fill="#B79CFF"/></g>`; }
    if(ok>0){ o+=`<g opacity="${ok}" transform="translate(0 -30) scale(${back(k(t,4.1,4.5))})"><circle r="60" fill="#14102A"/><path d="M-26 0 L-6 20 L28 -18" fill="none" stroke="#C8FF2E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>`+
      T(0,90,32,'Готово!',{c:'#14102A',op:ok})+`<rect x="-80" y="124" width="160" height="14" rx="7" fill="#14102A" opacity="${ok}"/>`; }
    // корона летит на телефон
    const fly=k(t,3.3,4.1);
    if(fly>0){ const x=420+370*fly, y=900-260*Math.sin(Math.PI*fly)+ (1170-900)*fly; }
    o+=`</g>`;
    // Могну: спит → просыпается → прыгает
    const jump=bump(t,3.0,3.6), sq=bump(t,3.6,3.85);
    const my=1180-180*jump, sc=1+.06*sq;
    const img=t<2.05?'off.svg':'on.svg', pop=t>=2.05?back(k(t,2.05,2.4)):1;
    o+=`<g transform="translate(400 ${my}) scale(${1.85*pop*sc} ${1.85*pop/sc}) translate(-120 -145)"><image href="${img}" width="240" height="290"/></g>`;
    // z-z
    if(t<2){ for(let i=0;i<3;i++){const p=((t*.7)+i/3)%1;o+=T(560+60*p+i*10,860-220*p,50+20*i,'z',{c:'#fff',op:Math.sin(Math.PI*p)*.8});} }
    // корона-«молния»: из короны Могну к телефону
    if(fly>0&&fly<1){const x=430+360*fly, y=780+(1140-780)*fly-240*Math.sin(Math.PI*fly);
      const B="M8 -60 L-30 6 H-2 L-10 60 L34 -10 H6 Z";o+=`<g transform="translate(${x} ${y}) rotate(${20*Math.sin(fly*9)}) scale(1.3)"><path d="${B}" fill="#fff" stroke="#fff" stroke-width="16" stroke-linejoin="round"/><path d="${B}" fill="#C8FF2E" stroke="#14102A" stroke-width="5" stroke-linejoin="round"/></g>`;}
    // подписи
    o+=`<g opacity="${eo(k(t,.3,.8))*(1-k(t,1.7,2.0))}">`+T(cx,600,62,'Опять грузится…',{f:'Unb'})+`</g>`;
    o+=`<g opacity="${eo(k(t,2.2,2.6))*(1-k(t,4.0,4.4))}">`+T(cx,560,58,'Могну, помоги!',{})+`</g>`;
    o+=`<g opacity="${eo(k(t,4.5,4.9))*(1-k(t,7.2,7.6))}">`+T(cx,660,72,'Одна кнопка —',{c:'#fff'})+T(cx,750,72,'и готово',{c:'#C8FF2E'})+`</g>`;
    // конфетти
    const cf=k(t,4.2,6.2);
    if(cf>0&&cf<1) for(const [dx,dy,r,c] of CONF){const x=790+dx*420*cf, y=1300-(500+400*dy)*cf+900*cf*cf; o+=`<rect x="${x}" y="${y}" width="18" height="10" rx="3" fill="${c}" opacity="${1-k(cf,.7,1)}" transform="rotate(${720*cf*r} ${x} ${y})"/>`;}
  }
  // ---- финал (7.6–11 с)
  const f=eo(k(t,7.6,8.3));
  if(f>0){
    o+=`<g opacity="${f}"><circle cx="${cx}" cy="1000" r="${360+20*Math.sin(t*2.5)}" fill="url(#gl)"/>`;
    const b=back(k(t,7.6,8.3)), bob=8*Math.sin((t-7.6)*3.2);
    o+=`<g transform="translate(${cx} ${1000+bob}) scale(${2.1*b}) translate(-120 -145)"><image href="on.svg" width="240" height="290"/></g>`;
    o+=T(cx,1500,104,'Пора могнуть!',{extra:` transform="translate(0 ${30*(1-eo(k(t,8.0,8.6)))})" opacity="${eo(k(t,8.0,8.6))}"`});
    o+=`<g opacity="${eo(k(t,8.5,9.0))}"><rect x="290" y="1580" width="500" height="96" rx="48" fill="#C8FF2E"/>`+T(cx,1645,46,'mognu.app',{c:'#14102A'})+`</g>`;
    o+=T(cx,1760,34,'Mognu VPN',{f:'Onest',w:700,c:'#B9B2D9',op:eo(k(t,8.8,9.3))});
    o+=`</g>`;
  }
  document.getElementById('s').innerHTML=o;
};
</script></body></html>
